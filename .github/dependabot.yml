# Keeps the shared workflows' actions (pinned by commit) and the dev shell's
# flake inputs current. Its pull requests are merged by hand; an action update
# reaches the repositories that call these workflows only with the next
# release (README.md).
version: 2
updates:
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
    # A revision is proposed once it is a week old: long enough for a
    # compromised or broken upstream commit to be noticed and reverted first.
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
