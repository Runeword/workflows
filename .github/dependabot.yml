# Keeps the shared workflows' pinned actions current (they are pinned by
# commit). Its pull requests are merged by hand, and reach the repositories
# that call these workflows only with the next release (README.md).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # A revision is proposed once it is a week old: long enough for a
    # compromised or broken upstream commit to be noticed and reverted first.
    cooldown:
      default-days: 7
